; ESP32-L(C73) + GDEP073E01 (7.3" E Ink Spectra 6, 800x480)
; PlatformIO / Arduino framework
;
; Official Good Display toolchain uses Arduino IDE with board "WEMOS LOLIN32".
; PlatformIO's "esp32dev" target is equivalent for the ESP32-WROOM-32D.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Keep the library dependency graph complete for GxEPD2's conditional includes.
lib_ldf_mode = deep+

lib_deps =
  https://github.com/ZinggJM/GxEPD2.git#1.6.9
  adafruit/Adafruit GFX Library@^1.11.11

build_flags =
  -DCORE_DEBUG_LEVEL=0
  ; Uncomment to enable timer deep sleep after the demo (seconds).
  ; -DEPD_DEEP_SLEEP_SECONDS=3600
